<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JournIT - Sign In</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">
<!-- auth-body: CSS will give this page the warm off-white background -->

    <!-- AUTH WRAPPER ─────────────────────────────────────
         Full-screen invisible box.
         CSS will center its child (auth-card) on the page.
    ──────────────────────────────────────────────────── -->
    <div class="auth-wrapper">

        <div class="auth-card">

            <!-- LOGO AREA: logo image + brand name on the same line -->
            <div class="auth-logo-area">
                <img src="images/logo.png"
                     alt="JournIT Logo"
                     class="auth-logo-img">
                <span class="auth-brand-name">JournIT</span>
            </div>

            <!--MAIN HEADING-->
            <h1 class="auth-heading">Welcome back</h1>

            <p class="auth-subtext">Sign in to continue your journey.</p>

            <!-- FORM GROUP -->
            <div class="auth-form">

                <!-- USERNAME FIELD -->
                <!-- label for="username" connects to input id="username" -->
                <label class="auth-label" for="username">Username</label>
                <input class="auth-input"
                       type="text"
                       id="username"
                       placeholder="Enter your username">

                <!-- PASSWORD FIELD -->
                <!-- type="password" hides characters with dots -->
                <label class="auth-label" for="password">Password</label>
                <input class="auth-input"
                       type="password"
                       id="password"
                       placeholder="Enter your password">

                <!-- SIGN IN BUTTON -->
                <!-- onclick calls the signIn() function in script.js -->
                <button class="auth-btn" onclick="signIn()">
                    Sign In
                </button>

                <!-- navigates to signup page -->
                <p class="auth-switch">
                    Don't have an account?
                    <a href="signup.html" class="auth-link">Sign Up</a>
                </p>

            </div>

        </div>

    </div>

    <!-- FOOTER  -->
    <footer class="auth-footer">
        <div class="auth-footer-content">
            <span>Contact us: 09938653644</span>
            <span>Email Us: JournIT@gmail.com</span>
            <!-- visible space around the dot separator -->
            <span class="auth-footer-version">
                JournIT &nbsp;·&nbsp; Version 1.0.0
            </span>
        </div>
    </footer>

    <!-- loads JavaScript last -->
    <script src="js/script.js"></script>

</body>
</html>
