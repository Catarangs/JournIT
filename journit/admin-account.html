<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JournIT - Admin Account</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body-page">


<!-- ═══════════════════════════════════════════════
     ADMIN PAGE WRAPPER
     Identical outer structure to admin.html.
     Same flex column — header on top, body below.
═══════════════════════════════════════════════ -->
<div class="admin-page-wrapper">


    <!-- ═══════════════════════════════════════════
         ADMIN HEADER
         Exactly the same as admin.html.
         Same class names — CSS styles both the same.
    ═══════════════════════════════════════════ -->
    <div class="admin-header">
        <div class="admin-header-inner">
            <div class="header-left">
                <img src="images/logo.png"
                     alt="JournIT Logo"
                     class="header-logo">
                <span class="header-brand">JournIT</span>
            </div>
        </div>
    </div>
    <!-- end admin-header -->


    <!-- ═══════════════════════════════════════════
         ADMIN BODY
         Identical flex row structure to admin.html.
         Sidebar left — content right.
    ═══════════════════════════════════════════ -->
    <div class="admin-body">


        <!-- ─────────────────────────────────────
             SIDEBAR
             Exact copy of admin.html sidebar.
             Same ids, same classes, same buttons.
             JS fills admin-display-name on both pages
             using the same function.
        ───────────────────────────────────────── -->
        <aside class="admin-sidebar">

            <div class="admin-profile-area">

                <div class="admin-avatar-circle">
                    <img src="images/user-icon.png"
                         alt="Admin"
                         class="admin-avatar-icon">
                </div>

                <!-- Same id as admin.html — JS fills both -->
                <p id="admin-display-name"
                   class="admin-sidebar-name"></p>

                <p class="admin-sidebar-role">
                    Administrator
                </p>

            </div>

            <div class="admin-sidebar-spacer"></div>

            <div class="admin-sidebar-nav">

                <!-- Account button: navigates to this page -->
                <!-- On this page it just reloads — that is fine -->
                <button class="admin-nav-btn"
                        onclick="window.location.href=
                        'admin-account.html'">
                    Account
                </button>

                <button class="admin-signout-btn"
                        onclick="adminSignOut()">
                    Sign Out
                </button>

            </div>

        </aside>
        <!-- end admin-sidebar -->


        <!-- ─────────────────────────────────────
             MAIN CONTENT
             This is the ONLY part different from
             admin.html — everything above is the same.
             No statistics here — just the account card.
        ───────────────────────────────────────── -->
        <main class="admin-content">

            <!-- WELCOME SECTION -->
            <div class="admin-welcome">

                <!-- Different heading from admin.html -->
                <!-- Describes what this page does -->
                <h1 class="admin-welcome-heading">
                    Account Settings
                </h1>

                <p class="admin-welcome-sub">
                    Manage your administrator profile.
                </p>

                <hr class="admin-divider">

            </div>
            <!-- end admin-welcome -->


            <!-- ACCOUNT CARD: single white card -->
            <!-- Contains profile display + view/edit states -->
            <div class="admin-account-card">


                <!-- ─────────────────────────────
                     PROFILE DISPLAY
                     Always visible — never hidden.
                     Shows avatar, username, role label.
                     Sits above the view and edit states.
                ─────────────────────────────────── -->
                <div class="admin-profile-display">

                    <!-- Larger avatar than the sidebar -->
                    <div class="admin-account-avatar">
                        <img src="images/user-icon.png"
                             alt="Admin Avatar"
                             class="admin-account-avatar-icon">
                    </div>

                    <!-- Username from database — filled by JS -->
                    <!-- Different id from sidebar admin-display-name
                         because both are on the same page and ids
                         must be unique — JS fills both separately -->
                    <p id="account-display-username"
                       class="admin-account-username"></p>

                    <!-- Role label: always the same for every admin -->
                    <!-- Hardcoded because it never changes -->
                    <p class="account-role-label">
                        JournIT Administrator
                    </p>

                </div>
                <!-- end admin-profile-display -->


                <!-- ─────────────────────────────
                     VIEW STATE — shown by default
                     Read-only display of credentials.
                     Edit Profile button switches to
                     the edit state below.
                ─────────────────────────────────── -->
                <div id="admin-view-state">

                    <!-- SECTION HEADER: title + edit button -->
                    <div class="section-header-row">
                        <h3 class="section-title">
                            Account Details
                        </h3>
                        <!-- Edit Profile: switches to edit state -->
                        <!-- Different function name from user page
                             to avoid conflicts in script.js -->
                        <button class="edit-profile-btn"
                                onclick="showAdminEditState()">
                            <img src="images/edit-icon.png"
                                 alt="Edit"
                                 class="btn-icon-small">
                            Edit Profile
                        </button>
                    </div>

                    <!-- USERNAME ROW -->
                    <!-- label left — value right -->
                    <div class="detail-row">
                        <span class="detail-label">
                            Username
                        </span>
                        <!-- JS fills this from session data -->
                        <span id="admin-view-username"
                              class="detail-value"></span>
                    </div>

                    <!-- DIVIDER between rows -->
                    <hr class="detail-divider">

                    <!-- ROLE ROW -->
                    <!-- label left — hardcoded value right -->
                    <!-- Role never changes so no need to fetch it -->
                    <div class="detail-row">
                        <span class="detail-label">
                            Role
                        </span>
                        <span class="detail-value">
                            Administrator
                        </span>
                    </div>

                </div>
                <!-- end admin-view-state -->


                <!-- ─────────────────────────────
                     EDIT STATE — hidden by default
                     Appears when Edit Profile clicked.
                     Inputs pre-filled by JavaScript.
                     Save Changes sends to PHP.
                     Cancel returns to view state.
                ─────────────────────────────────── -->
                <div id="admin-edit-state" class="hidden">

                    <h3 class="section-title">
                        Account Details
                    </h3>

                    <!-- EDIT FORM WRAPPER: light background -->
                    <div class="edit-form-wrapper">

                        <!-- USERNAME INPUT -->
                        <label class="edit-label"
                               for="admin-edit-username">
                            Username
                        </label>
                        <!-- pre-filled by JS when edit state opens -->
                        <input type="text"
                               id="admin-edit-username"
                               class="edit-input"
                               placeholder="Enter new username">

                        <!-- PASSWORD INPUT -->
                        <label class="edit-label"
                               for="admin-edit-password">
                            Password
                        </label>
                        <!-- type="password" hides characters -->
                        <!-- Leave blank to keep current password -->
                        <input type="password"
                               id="admin-edit-password"
                               class="edit-input"
                               placeholder="Enter new password">

                        <!-- SMALL HINT: explains password field -->
                        <!-- Good UX — tells admin what blank means -->
                        <p class="edit-hint">
                            Leave password blank to keep
                            your current password unchanged.
                        </p>

                        <!-- EDIT BUTTONS: Cancel and Save -->
                        <div class="edit-buttons-row">

                            <!-- CANCEL: hides edit state -->
                            <!-- returns to view state -->
                            <button class="cancel-edit-btn"
                                    onclick="hideAdminEditState()">
                                &#x2715; Cancel
                            </button>

                            <!-- SAVE: sends update to PHP -->
                            <!-- calls saveAdminProfileChanges()
                                 in script.js -->
                            <button class="save-changes-btn"
                                    onclick="
                                    saveAdminProfileChanges()">
                                &#128190; Save Changes
                            </button>

                        </div>
                        <!-- end edit-buttons-row -->

                    </div>
                    <!-- end edit-form-wrapper -->

                </div>
                <!-- end admin-edit-state -->


            </div>
            <!-- end admin-account-card -->

        </main>
        <!-- end admin-content -->

    </div>
    <!-- end admin-body -->

</div>
<!-- end admin-page-wrapper -->


<!-- SCRIPT: always last -->
<script src="js/script.js"></script>

</body>
</html>
